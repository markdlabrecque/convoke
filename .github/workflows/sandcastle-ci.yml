name: CI

on:
  pull_request:
  push:
    branches: [main, spike-3]

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Test Factory model selection and provider wiring
        run: node --test .sandcastle/models.test.mts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate protocol JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("protocol").rglob("*.json"))
          for path in files:
              json.loads(path.read_text())
          print(f"Validated JSON syntax in {len(files)} protocol file(s).")
          PY
