name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'protocol/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'protocol/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      APPLE_TEST_OUTPUT_DIR: ${{ runner.temp }}/convoke-apple-results
    steps:
      - uses: actions/checkout@v4
      - name: Validate script failure propagation with fake tools
        run: ios/Convoke/scripts/test-apple-driver.sh
      - name: Validate invalid simulator override
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set +e
          SIMULATOR_UDID=not-a-valid-udid "$GITHUB_WORKSPACE/ios/Convoke/scripts/test-apple.sh" > invalid-simulator.log 2>&1
          status=$?
          set -e
          cat invalid-simulator.log
          test "$status" -ne 0
          grep -q 'SIMULATOR_UDID is invalid/unavailable' invalid-simulator.log
      - name: Run shared Apple checks from outside the repository
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/ios/Convoke/scripts/test-apple.sh"'
      - name: Preserve Apple logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-results-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/invalid-simulator.log
            ${{ env.APPLE_TEST_OUTPUT_DIR }}/**/*.log
            ${{ env.APPLE_TEST_OUTPUT_DIR }}/**/*.json
            ${{ env.APPLE_TEST_OUTPUT_DIR }}/**/*.txt
            ${{ env.APPLE_TEST_OUTPUT_DIR }}/**/*.xcresult
